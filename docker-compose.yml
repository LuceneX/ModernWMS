services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: modernwms-backend
    ports:
      - "5555:5555"
    volumes:
      - ./backend/ModernWMS/wms.db:/app/wms.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: modernwms-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
