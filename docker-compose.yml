services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: modernwms-backend
    ports:
      - "5555:5555"
    volumes:
      - modernwms-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: modernwms-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: /api
      BACKEND_SERVICE: http://backend:5555
    restart: unless-stopped

volumes:
  modernwms-data:
